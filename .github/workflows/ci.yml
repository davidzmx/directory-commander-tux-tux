name: CI
on:
  push:
    branches: ["**"]  # solo ramas: con una etiqueta v*, las pruebas las lanza el workflow de los paquetes antes de publicar
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # aquí tarda unos 20: pasado esto es que algo se ha quedado colgado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliotecas de sistema que necesita Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0
      - run: python -m pip install -e ".[dev]"
      # Las pruebas del reproductor se omiten en Windows si no hay ninguna.
      - name: Salidas de audio que ve Qt
        run: python -c "from PySide6.QtGui import QGuiApplication; from PySide6.QtMultimedia import QMediaDevices; app = QGuiApplication([]); print([d.description() for d in QMediaDevices.audioOutputs()])"
        env:
          QT_QPA_PLATFORM: offscreen
      # Si una prueba tarda más de 5 minutos, escribe en el registro dónde está parada.
      - run: python -m pytest tests -q -o faulthandler_timeout=300
        env:
          QT_QPA_PLATFORM: offscreen
