name: Paquetes
# Genera los instaladores y las versiones portables en cada sistema en cada push a main y en cada PR. Con una etiqueta v*, además los publica en una versión de GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # Antes de publicar una versión, las mismas pruebas que en cada push. En un push normal ya las corre ci.yml.
  tests:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: choco install innosetup --no-progress -y
      - run: python packaging/build.py exe
      - name: Textos de las licencias GNU
        shell: bash
        run: |
          mkdir -p dist/directory-commander-tux-tux/licenses
          curl -fsSL https://www.gnu.org/licenses/lgpl-3.0.txt -o dist/directory-commander-tux-tux/licenses/LGPL-3.0.txt
          curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o dist/directory-commander-tux-tux/licenses/GPL-3.0.txt
      - run: python packaging/build.py portable
      - run: python packaging/build.py installer
      # Un artifact por paquete, para poder bajar solo el que haga falta.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.exe
          archive: false  # se descarga tal cual, sin meterlo en un zip
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false  # se descarga tal cual, sin meterlo en un zip
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliotecas de sistema que necesita Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0 libpulse0 libfuse2t64
      - run: python -m pip install -e ".[dev]"
      - name: appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
      - run: python packaging/build.py exe
      - name: Textos de las licencias GNU
        run: |
          mkdir -p dist/directory-commander-tux-tux/licenses
          curl -fsSL https://www.gnu.org/licenses/lgpl-3.0.txt -o dist/directory-commander-tux-tux/licenses/LGPL-3.0.txt
          curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o dist/directory-commander-tux-tux/licenses/GPL-3.0.txt
      - run: python packaging/build.py portable
      - run: python packaging/build.py installer
      - run: python packaging/build.py appimage
      - name: Comprobar el paquete .deb
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -q "usr/bin/directory-commander-tux-tux"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.deb
          archive: false  # se descarga tal cual, sin meterlo en un zip
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false  # se descarga tal cual, sin meterlo en un zip
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.AppImage
          archive: false  # se descarga tal cual, sin meterlo en un zip
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: paquetes
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes paquetes/*
